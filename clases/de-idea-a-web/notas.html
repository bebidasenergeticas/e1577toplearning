<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Notas del profesor · E1577</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <header class="n-head">
    <div>
      <p class="n-eyebrow">Notas del profesor · privado</p>
      <h1 class="n-title" id="n-title">Esperando la presentación…</h1>
      <p class="n-meta" id="n-meta"></p>
    </div>
    <div class="n-clock">
      <span id="n-time">--:--</span>
      <span class="n-timer"><b id="n-elapsed">00:00</b> <button type="button" id="n-timer-btn">Iniciar</button> <button type="button" id="n-timer-reset" title="Reiniciar cronómetro">↺</button></span>
    </div>
  </header>

  <nav class="n-controls" aria-label="Control de la presentación">
    <button type="button" data-cmd="prev">◀ Anterior</button>
    <button type="button" data-cmd="next" class="primary">Siguiente ▶</button>
    <button type="button" data-cmd="blackout" title="Pantalla en negro (B)">Pausa</button>
    <button type="button" id="n-size" title="Tamaño del texto">A±</button>
  </nav>
  <p class="n-status" id="n-status">Abre la presentación en otra pestaña o ventana del mismo navegador.</p>

  <main id="n-body" class="n-body"></main>

  <details class="n-index">
    <summary>Saltar a un capítulo</summary>
    <div id="n-index"></div>
  </details>

  <footer class="n-foot">Teclas en esta ventana: ← → avanzan la presentación · B pausa. Comparte en Meet solo la pestaña de la presentación.</footer>
  <script type="module" src="/src/notes-main.js"></script>
</body>
</html>
